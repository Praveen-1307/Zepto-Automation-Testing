[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s | %(levelname)s | %(name)s | %(message)s
log_date_format = %Y-%m-%d %H:%M:%S
markers =
    smoke: essential public site availability and home UI checks
    regression: full regression coverage
    search: product search behavior
    product: product details and availability
    cart: cart behavior (never checkout/payment)
    login: login UI and safe validation only
    category: category browsing
    e2e: public shopping flow stopped before checkout/payment
